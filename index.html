    <!-- Aplica tema e idioma antes del primer pintado para evitar parpadeos -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          root.dataset.theme = theme;
          var lang = new URLSearchParams(location.search).get("lang") || localStorage.getItem("lang");
          if (lang !== "es" && lang !== "en") {
            lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
          }
          root.lang = lang;
        } catch (e) {}
      })();
